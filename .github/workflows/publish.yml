name: publish

# Publishing is gated on a version bump, not on the push itself. Every merge to
# main runs this; only a merge that cuts a new version actually releases.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: version gate
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install packaging
      # Blocks a release that skips versions, moves backwards, or is not a plain
      # MAJOR.MINOR. A version already on PyPI is a no-op, not a failure, so
      # ordinary merges to main do not turn the branch red.
      - id: check
        run: python .github/scripts/check_version.py

  test:
    name: tests
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run pytest -q

  publish:
    name: build and publish
    needs: [gate, test]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zeroproof-simulations
    permissions:
      id-token: write   # PyPI Trusted Publishing, no API token stored anywhere
      contents: write   # to push the release tag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      # Two supported auth paths. Trusted Publishing (OIDC) needs no secret and
      # is preferred: nothing long-lived is stored in the repo. If a token
      # secret is present it wins, which matches the UV_PUBLISH_TOKEN
      # convention already used elsewhere in the org. Setting neither fails the
      # step with PyPI's own error.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN || secrets.UV_PUBLISH_TOKEN }}
      - name: tag the release
        env:
          V: ${{ needs.gate.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "zeroproof-simulations $V"
          git push origin "v$V"
