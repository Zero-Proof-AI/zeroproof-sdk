[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroproof"
version = "0.30"
description = "ZeroProof Python SDK: trace ingestion and verification client, plus agent simulations grounded in your tools and system prompt."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["requests>=2.25.0"]
authors = [{name = "Zero Proof AI"}]
keywords = [
    "rl", "reinforcement-learning", "grpo", "synthetic-data", "agents",
    "tool-use", "evaluation", "simulation", "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Zero-Proof-AI/zeroproof-sdk"
Repository = "https://github.com/Zero-Proof-AI/zeroproof-sdk"
Issues = "https://github.com/Zero-Proof-AI/zeroproof-sdk/issues"
Datasets = "https://huggingface.co/datasets/zero-proof-ai/agent-simulations"

[project.scripts]
zeroproof = "zeroproof.cli:main"
zeroproof-simulations = "zeroproof.simulations.score.quality:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.12", "mypy>=1.16",
       "types-requests"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
zeroproof = ["py.typed"]
"zeroproof.simulations" = ["py.typed", "schemas/*.json"]

[tool.setuptools.packages.find]
where = ["."]
include = ["zeroproof*", "zeroproof_simulations"]
# behaviors is internal tooling for our own training runs: in the repo,
# never in the wheel.
exclude = ["tests*", "examples*", "docs*", "specs*",
           "zeroproof.simulations.behaviors*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # long lines: the formatter owns wrapping; prose in docstrings stays
    "RUF001", "RUF002", "RUF003",  # typographic dashes and arrows in prose
    "RUF012",  # mutable class defaults are used deliberately as registries
    "SIM115",  # open() without a context manager where the handle is returned
    "B905",    # zip(strict=) everywhere reads worse than the cases it protects
]

[tool.ruff.lint.per-file-ignores]
# The package init re-exports the public surface; the re-exports are the point.
"zeroproof/simulations/__init__.py" = ["F401", "E402"]
"zeroproof/__init__.py" = ["F401"]
# Examples and the identity generator set sys.path before importing.
"examples/**" = ["E402"]
"tests/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["zeroproof", "zeroproof_simulations", "tests"]

[tool.mypy]
python_version = "3.10"
packages = ["zeroproof"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Debt: these modules hang attributes on function objects at runtime
# (the situation writer is a closure with state). They type-check once
# the writer is a class. Tracked in CHANGELOG under hygiene.
[[tool.mypy.overrides]]
module = [
    "zeroproof.simulations.generate.generator",
    "zeroproof.simulations.generate.scenarios",
    "zeroproof.simulations.run.engine",
]
ignore_errors = true
