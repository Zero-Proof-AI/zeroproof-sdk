[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "whileai"
version = "0.68"
description = "Post-training data and evaluation for tool-using LLM agents: simulate, grade, measure, select, train, export, with the checks from rlhfbook.com."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["requests>=2.25.0", "pydantic>=2.0"]
authors = [{name = "Jacob Weiss"}]
keywords = [
    "zp", "zeroproof", "while", "evals", "agent-evals",
    "rl", "reinforcement-learning", "grpo", "synthetic-data", "agents",
    "tool-use", "evaluation", "simulation", "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/whilehq/whileai-sdk"
Repository = "https://github.com/whilehq/whileai-sdk"
Issues = "https://github.com/whilehq/whileai-sdk/issues"
Datasets = "https://huggingface.co/datasets/zero-proof-ai/agent-simulations"

[project.scripts]
whileai = "whileai.cli:main"
# same CLI under the two names people type: the product is "zp"
# (keys start with zp_) and "wai" is the short import alias.
zp = "whileai.cli:main"
wai = "whileai.cli:main"
whileai-simulations = "whileai.simulations.score.quality:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-xdist>=3.6", "ruff>=0.12",
       "mypy>=1.16", "types-requests"]
rl = ["verifiers>=0.3; python_version >= '3.11' and python_version < '3.14'"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
whileai = ["py.typed"]
"whileai.simulations" = ["py.typed", "schemas/*.json"]

[tool.setuptools.packages.find]
where = ["."]
include = ["whileai*"]
# behaviors is internal tooling for our own training runs: in the repo,
# never in the wheel.
exclude = ["tests*", "recipes*", "docs*", "specs*",
           "whileai.simulations.behaviors*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# One worker per core. The suite is 1,600 small tests with no shared state;
# serial it takes about three minutes, on four cores about forty seconds.
# Pass -n0 for a serial run (needed for --pdb and for reading -s output in order).
addopts = "-n auto"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # long lines: the formatter owns wrapping; prose in docstrings stays
    "RUF001", "RUF002", "RUF003",  # typographic dashes and arrows in prose
    "RUF012",  # mutable class defaults are used deliberately as registries
    "SIM115",  # open() without a context manager where the handle is returned
    "B905",    # zip(strict=) everywhere reads worse than the cases it protects
]

[tool.ruff.lint.per-file-ignores]
# The package init re-exports the public surface; the re-exports are the point.
"whileai/simulations/__init__.py" = ["F401", "E402"]
"whileai/__init__.py" = ["F401"]
# Examples and the identity generator set sys.path before importing.
"recipes/**" = ["E402"]
"tests/**" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["whileai", "tests"]

[tool.mypy]
python_version = "3.10"
packages = ["whileai"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Debt: these modules hang attributes on function objects at runtime
# (the situation writer is a closure with state). They type-check once
# the writer is a class. Tracked in CHANGELOG under hygiene.
[[tool.mypy.overrides]]
module = [
    "whileai.simulations.generate.generator",
    "whileai.simulations.generate.scenarios",
    "whileai.simulations.run.engine",
]
ignore_errors = true
